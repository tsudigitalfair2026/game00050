<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>パンダVSワニ シューティング</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
    background:#222;
    color:#fff;
    touch-action:none;
}
.screen{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}
.screen.active{
    display:flex;
}
h1{
    margin-bottom:15px;
}
p{
    line-height:1.7;
}
button{
    margin-top:20px;
    min-width:180px;
    min-height:60px;
    border:none;
    border-radius:14px;
    font-size:1.1rem;
    font-weight:bold;
    background:#ffca28;
    color:#000;
}
#gameScreen{
    padding:0;
    justify-content:flex-start;
}
#hud{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#111;
    font-size:1.05rem;
}
#gameArea{
    position:relative;
    width:100%;
    flex:1;
    overflow:hidden;
    background:linear-gradient(#87ceeb,#dff7ff);
    touch-action:none;
}
#player{
    position:absolute;
    font-size:54px;
    user-select:none;
    z-index:5;
}
.enemy{
    position:absolute;
    font-size:46px;
    user-select:none;
}
.bullet{
    position:absolute;
    font-size:26px;
    user-select:none;
}
#speedNotice{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:2rem;
    font-weight:bold;
    color:#ff1744;
    display:none;
    z-index:20;
    text-shadow:2px 2px 6px #fff;
}
#rank{
    font-size:2rem;
    margin-top:15px;
    color:#ffd54f;
}
</style>
</head>

<body>

<div id="startScreen" class="screen active">
    <h1>🐼 パンダVSワニ</h1>

    <p>
        パンダを左右に動かそう！<br>
        竹ミサイルでワニをやっつけよう！<br>
        タップや長押しで連続発射！<br>
        制限時間は30秒！<br>
        15秒経過するとスピードアップ！
    </p>

    <button id="startBtn">ゲームスタート</button>
</div>

<div id="gameScreen" class="screen">

    <div id="hud">
        <div>スコア: <span id="score">0</span></div>
        <div>残り: <span id="time">30</span>秒</div>
    </div>

    <div id="gameArea">
        <div id="speedNotice">⚡スピードアップ⚡</div>
        <div id="player">🐼</div>
    </div>

</div>

<div id="resultScreen" class="screen">
    <h1>ゲーム終了</h1>

    <p>最終スコア</p>
    <h2 id="finalScore">0</h2>

    <div id="rank">ランク C</div>

    <button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const gameArea=document.getElementById("gameArea");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const speedNotice=document.getElementById("speedNotice");

let score=0;
let timeLeft=30;

let playerX=0;

let bullets=[];
let enemies=[];

let gameRunning=false;
let speedMode=false;

let enemyInterval=null;
let timerInterval=null;
let animationId=null;
let autoFire=null;

function showScreen(screen){
    startScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");
    screen.classList.add("active");
}

function startGame(){

    score=0;
    timeLeft=30;
    speedMode=false;

    bullets=[];
    enemies=[];

    document.querySelectorAll(".bullet,.enemy").forEach(e=>e.remove());

    scoreEl.textContent=score;
    timeEl.textContent=timeLeft;

    showScreen(gameScreen);

    const areaW=gameArea.clientWidth;
    const areaH=gameArea.clientHeight;

    playerX=(areaW/2)-25;

    player.style.left=playerX+"px";
    player.style.top=(areaH-90)+"px";

    gameRunning=true;

    enemyInterval=setInterval(createEnemy,700);

    timerInterval=setInterval(()=>{

        timeLeft--;
        timeEl.textContent=timeLeft;

        if(timeLeft===15){
            activateSpeedMode();
        }

        if(timeLeft<=0){
            endGame();
        }

    },1000);

    animationId=requestAnimationFrame(updateGame);
}

function activateSpeedMode(){

    speedMode=true;

    speedNotice.style.display="block";

    setTimeout(()=>{
        speedNotice.style.display="none";
    },1500);

}

function createEnemy(){

    if(!gameRunning) return;

    const enemy=document.createElement("div");
    enemy.className="enemy";

    // 敵をワニに変更
    enemy.textContent="🐊";

    const x=Math.random()*(gameArea.clientWidth-50);

    enemy.style.left=x+"px";
    enemy.style.top="-60px";

    gameArea.appendChild(enemy);

    enemies.push({
        el:enemy,
        x:x,
        y:-60,
        speed:speedMode
            ? 5+Math.random()*3
            : 3+Math.random()*2
    });
}

function shoot(){

    if(!gameRunning) return;

    const bullet=document.createElement("div");
    bullet.className="bullet";
    bullet.textContent="🎍";

    const x=playerX+15;
    const y=gameArea.clientHeight-110;

    bullet.style.left=x+"px";
    bullet.style.top=y+"px";

    gameArea.appendChild(bullet);

    bullets.push({
        el:bullet,
        x:x,
        y:y
    });
}

function updateGame(){

    const bulletSpeed=speedMode ? 12 : 9;

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.y-=bulletSpeed;
        b.el.style.top=b.y+"px";

        if(b.y<-40){
            b.el.remove();
            bullets.splice(i,1);
        }
    }

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        e.y+=e.speed+(speedMode?1.5:0);
        e.el.style.top=e.y+"px";

        if(e.y>gameArea.clientHeight+60){
            e.el.remove();
            enemies.splice(i,1);
            continue;
        }

        for(let j=bullets.length-1;j>=0;j--){

            const b=bullets[j];

            if(
                Math.abs(e.x-b.x)<35 &&
                Math.abs(e.y-b.y)<35
            ){

                e.el.remove();
                b.el.remove();

                enemies.splice(i,1);
                bullets.splice(j,1);

                score+=10;
                scoreEl.textContent=score;

                break;
            }
        }
    }

    if(gameRunning){
        animationId=requestAnimationFrame(updateGame);
    }
}

function endGame(){

    gameRunning=false;

    clearInterval(enemyInterval);
    clearInterval(timerInterval);
    clearInterval(autoFire);

    cancelAnimationFrame(animationId);

    let rank="C";

    if(score>=250){
        rank="S";
    }else if(score>=180){
        rank="A";
    }else if(score>=100){
        rank="B";
    }

    finalScoreEl.textContent=score;
    rankEl.textContent="ランク "+rank;

    showScreen(resultScreen);
}

function movePlayer(clientX){

    const rect=gameArea.getBoundingClientRect();

    playerX=clientX-rect.left-25;

    if(playerX<0){
        playerX=0;
    }

    if(playerX>gameArea.clientWidth-50){
        playerX=gameArea.clientWidth-50;
    }

    player.style.left=playerX+"px";
}

gameArea.addEventListener("pointerdown",(e)=>{

    movePlayer(e.clientX);
    shoot();

    clearInterval(autoFire);

    autoFire=setInterval(()=>{
        shoot();
    },250);

});

gameArea.addEventListener("pointermove",(e)=>{

    if(e.buttons || e.pointerType==="touch"){
        movePlayer(e.clientX);
    }

});

window.addEventListener("pointerup",()=>{

    clearInterval(autoFire);

});

gameArea.addEventListener("click",(e)=>{

    movePlayer(e.clientX);
    shoot();

});

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
</script>

</body>
</html>
